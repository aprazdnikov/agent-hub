name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target base -t agent-hub:ci .
      - name: Image starts and rejects empty config
        run: |
          out=$(docker run --rm agent-hub:ci 2>&1) && exit 1
          echo "$out" | grep -q "AGENT_HUB_TELEGRAM_TOKEN is required"
      - run: docker run --rm --entrypoint claude agent-hub:ci --version
      - run: docker build --target dev -t agent-hub:ci-dev .
      - name: Dev image has the toolchains
        run: >-
          docker run --rm --entrypoint sh agent-hub:ci-dev -c
          'java -version && mvn -v && node -v && npm -v && docker --version && docker compose version'
